name: Export Models, Data and Sounds

on:
  schedule:
    # Exports what a game update added or changed, the rest is skipped
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Export at most this many models (empty for all)"
        required: false
        default: ""
      force:
        description: "Export again models that did not change"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VRF_VERSION: "20.1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Export models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: node index.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' ${LIMIT:+--limit "$LIMIT"} ${{ inputs.force && '--force' || '' }}
      # Heroes, abilities, items, treasures, texts and icons; skipped when the game did not update
      - name: Export game data
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node data.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # New or changed sounds only, against sounds-state.json
      - name: Export sounds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node sounds.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Voice lines, the sounds of animations and abilities, music and announcer packs;
      # only after a patch, against audio-state.json
      - name: Export voice lines, animation and ability sounds
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node audio.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # The state files go back to main; another run may have pushed meanwhile, so this one
      # lands on top of it
      - name: Commit & push state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          files=$(ls state.json data-state.json sounds-state.json audio-state.json scenes-state.json 2>/dev/null)
          git add -- $files
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Exported models"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Exported models"; }
          done
          exit 1
