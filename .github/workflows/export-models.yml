name: Export

on:
  schedule:
    # Exports what a game update added or changed, the rest is skipped
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Only these exporters, comma separated (models, data, gamefiles, images, textures, videos, sounds, particles, audio, names, files-list); empty for all"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VRF_VERSION: "20.1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      # A run that waited in the queue starts from main as it is now, with the state files the
      # previous run pushed, not from the commit it was queued at
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      # Every exporter in one process (export.js): one Steam login, the game opened once. When
      # neither the game (its manifest) nor the code changed since the last full run, it stops at
      # once; otherwise each exporter exports what changed against its state file in state/
      - name: Export
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPORT_STEPS: ${{ inputs.steps }}
        run: node export.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # The state files go back to main; another run may have pushed meanwhile, so this one
      # lands on top of it
      - name: Commit & push state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Only the state files this run changed (or made), not the scenes' (the scenes job pushes
          # it): a state file pushed meanwhile from elsewhere (a server, this repo's own PC) is kept
          files=$( (git diff --name-only -- state/; git ls-files --others --exclude-standard -- state/) | grep -v '^state/scenes.json$' | sort -u)
          if [ -z "$files" ]; then
            echo "Nothing changed"
            exit 0
          fi
          git add -- $files
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Export state"
          exported=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            # Only the state files of this run go on top of main, so commits pushed meanwhile
            # (code, this workflow) are kept as they are
            git fetch origin main
            git reset -q --hard origin/main
            git checkout "$exported" -- $files
            git diff --cached --quiet && exit 0
            git commit -m "Export state"
          done
          exit 1

  # Scenes and maps (MVP showcases, treasures, event and battle pass scenes, backgrounds) to the
  # scenes dataset: new or changed map packages only, against state/scenes.json; a run stops
  # starting new ones after 300 minutes and the next run goes on from there
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      # A run that waited in the queue starts from main as it is now, with the state files the
      # previous run pushed, not from the commit it was queued at
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Export scenes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/scenes.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' --max-minutes 300
      # Only state/scenes.json, on top of whatever the other job pushed meanwhile
      - name: Commit & push state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          files=state/scenes.json
          git add -- $files
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Exported scenes"
          exported=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset -q --hard origin/main
            git checkout "$exported" -- $files
            git diff --cached --quiet && exit 0
            git commit -m "Exported scenes"
          done
          exit 1
