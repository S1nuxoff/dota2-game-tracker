name: Export Models

on:
  schedule:
    # Exports what a game update added or changed, the rest is skipped
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Export at most this many models (empty for all)"
        required: false
        default: ""
      force:
        description: "Export again models that did not change"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VRF_VERSION: "20.1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Export models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: node index.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' ${LIMIT:+--limit "$LIMIT"} ${{ inputs.force && '--force' || '' }}
      # Another run may have pushed meanwhile; this run's state is the newest
      - name: Move onto the latest main
        if: success() || failure()
        run: |
          git fetch --depth 1 origin main
          git reset --soft origin/main
      - name: Commit & push state
        if: success() || failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Exported models"
          file_pattern: state.json
