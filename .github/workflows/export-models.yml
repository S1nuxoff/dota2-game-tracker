name: Export

on:
  schedule:
    # Exports what a game update added or changed, the rest is skipped
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Export at most this many models (empty for all)"
        required: false
        default: ""
      force:
        description: "Export again models that did not change"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VRF_VERSION: "20.1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      # A run that waited in the queue starts from main as it is now, with the state files the
      # previous run pushed, not from the commit it was queued at
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Export models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: node exporters/models.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' ${LIMIT:+--limit "$LIMIT"} ${{ inputs.force && '--force' || '' }}
      # Heroes, abilities, items, treasures, texts and icons; skipped when the game did not update
      - name: Export game data
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/data.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Every script and localization of the game as JSON to the dota2-data dataset (gamefiles.js);
      # only files whose CRC changed, against state/gamefiles.json
      - name: Export the game's scripts and texts
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/gamefiles.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Every picture of the game's interface to dota2-images and every video to dota2-videos, as the
      # game keeps them; only what changed, against state/images.json and state/videos.json
      - name: Export pictures
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/images.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Every texture outside the interface to dota2-textures (images.js's workings), only what
      # changed, against state/textures.json
      - name: Export textures
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/textures.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      - name: Export videos
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/videos.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # New or changed sounds only, against state/sounds.json
      - name: Export sounds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/sounds.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Particle systems of the heroes' and items' effects, their textures, their snapshots
      # (and those items put in their place), the models' attachments, and every model's sequences
      # with the effects its animations start; only what changed, against state/particles.json
      - name: Export particles
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/particles.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # Voice lines, the sounds of animations and abilities, music and announcer packs;
      # only after a patch, against state/audio.json
      - name: Export voice lines, animation and ability sounds
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/audio.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # The names people know for the pictures and models (names.json in dota2-images and
      # dota2-models), from the game's English texts; only after a game update
      - name: Name the files
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/names.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}'
      # A list of every file at the root of each dataset (files.json), for pages that show a whole
      # dataset; only for datasets that changed since their list
      - name: List the datasets' files
        if: success() || failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/files-list.js
      # The state files go back to main; another run may have pushed meanwhile, so this one
      # lands on top of it
      - name: Commit & push state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Every state file but the scenes', which the scenes job pushes
          files=$(ls state/*.json 2>/dev/null | grep -v '^state/scenes.json$')
          git add -- $files
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Exported models"
          exported=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            # Only the state files of this run go on top of main, so commits pushed meanwhile
            # (code, this workflow) are kept as they are
            git fetch origin main
            git reset -q --hard origin/main
            git checkout "$exported" -- $files
            git diff --cached --quiet && exit 0
            git commit -m "Exported models"
          done
          exit 1

  # Scenes and maps (MVP showcases, treasures, event and battle pass scenes, backgrounds) to the
  # scenes dataset: new or changed map packages only, against state/scenes.json; a run stops
  # starting new ones after 300 minutes and the next run goes on from there
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      # A run that waited in the queue starts from main as it is now, with the state files the
      # previous run pushed, not from the commit it was queued at
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Export scenes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node exporters/scenes.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' --max-minutes 300
      # Only state/scenes.json, on top of whatever the other job pushed meanwhile
      - name: Commit & push state
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          files=state/scenes.json
          git add -- $files
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Exported scenes"
          exported=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset -q --hard origin/main
            git checkout "$exported" -- $files
            git diff --cached --quiet && exit 0
            git commit -m "Exported scenes"
          done
          exit 1
